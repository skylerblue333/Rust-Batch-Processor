[package]
name = "sky-batch-processor"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Bounded in-memory batch queue and HTTP service"
license = "MIT"

[[bin]]
name = "sky-batch-processor"
path = "src/main.rs"

[lib]
name = "sky_batch_processor"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
